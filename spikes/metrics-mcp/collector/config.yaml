# The toolkit's WithAppForwarding() sets ASPIRE_ENDPOINT / ASPIRE_API_KEY / ASPIRE_INSECURE on the
# collector container; the toolkit does not supply a default pipeline, this file is the whole config.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Aspire dashboard: all signals, always.
  otlp/aspire:
    endpoint: ${env:ASPIRE_ENDPOINT}
    headers:
      x-otlp-api-key: ${env:ASPIRE_API_KEY}
    tls:
      insecure: ${env:ASPIRE_INSECURE}
      insecure_skip_verify: true

service:
  pipelines:
    # Candidate pipelines live in config-a.yaml / config-b.yaml (extra pipeline keys merge, lists do not).
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/aspire]
