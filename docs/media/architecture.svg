<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Rubber Duck Agency demo: system architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box   { stroke-width: 2; }
      .app   { fill: #dbeafe; stroke: #2563eb; }
      .infra { fill: #f1f5f9; stroke: #64748b; }
      .msg   { fill: #fef3c7; stroke: #d97706; }
      .ext   { fill: #ffffff; stroke: #94a3b8; stroke-dasharray: 6 4; }
      .h     { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .t     { font-size: 13px; fill: #334155; }
      .m     { font-size: 12px; fill: #334155; font-family: Consolas, Menlo, monospace; }
      .lbl   { font-size: 12px; fill: #475569; }
      .edge  { fill: none; stroke: #475569; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1240" height="640" fill="#ffffff"/>

  <text x="40" y="42" font-size="24" font-weight="700" fill="#0f172a">Rubber Duck Agency demo: system architecture</text>
  <text x="40" y="64" class="t">One Aspire AppHost runs everything on the local machine; attendees reach only the site, through a Cloudflare tunnel.</text>

  <!-- AppHost boundary -->
  <rect x="280" y="100" width="920" height="510" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="124" font-size="13" font-weight="700" fill="#475569">Aspire AppHost · local machine</text>

  <!-- Outside: who reaches the site -->
  <rect x="40" y="140" width="190" height="46" rx="10" class="box ext"/>
  <text x="135" y="161" text-anchor="middle" class="h">Presenter</text>
  <text x="135" y="178" text-anchor="middle" class="lbl">browser on localhost</text>
  <path d="M230 163 H316" class="edge" marker-end="url(#arrow)"/>

  <rect x="40" y="210" width="190" height="46" rx="10" class="box ext"/>
  <text x="135" y="231" text-anchor="middle" class="h">Cloudflare tunnel</text>
  <text x="135" y="248" text-anchor="middle" class="lbl">public URL, site only</text>
  <path d="M230 233 H316" class="edge" marker-end="url(#arrow)"/>

  <rect x="40" y="320" width="190" height="50" rx="10" class="box ext"/>
  <text x="135" y="342" text-anchor="middle" class="h">Attendees</text>
  <text x="135" y="360" text-anchor="middle" class="lbl">phone browser, QR code</text>
  <path d="M135 320 V260" class="edge" marker-end="url(#arrow)"/>

  <!-- site -->
  <rect x="320" y="140" width="850" height="110" rx="10" class="box app"/>
  <text x="340" y="168" class="h">site  <tspan class="t" font-weight="400">Umbraco 17 · SuperPower.Web</tspan></text>
  <text x="340" y="194" class="t">Home, About us, Contact us, Events, Services</text>
  <text x="340" y="214" class="t">Contact, service enquiry and event booking forms</text>
  <text x="340" y="234" class="t">Each stored submission gets a reference ACME-nnnn</text>
  <text x="780" y="194" class="t">Event pages show the booking count</text>
  <text x="780" y="214" class="t">Stored event bookings are queued for counting</text>
  <text x="780" y="234" class="t">Contact and service enquiry send no message</text>

  <!-- site -> dependencies -->
  <path d="M400 250 V326" class="edge" marker-end="url(#arrow)"/>
  <text x="408" y="292" class="lbl">store submission</text>

  <path d="M590 250 V326" class="edge" marker-end="url(#arrow)"/>
  <text x="598" y="284" class="lbl">owner email</text>
  <text x="598" y="300" class="lbl">SMTP :2525</text>

  <path d="M810 250 V326" class="edge" marker-end="url(#arrow)"/>
  <text x="818" y="284" class="lbl">GET count, HTTP</text>
  <text x="818" y="300" class="lbl">2 s cap, fail-soft</text>

  <path d="M1085 250 V326" class="edge" marker-end="url(#arrow)"/>
  <text x="1093" y="284" class="lbl">publish</text>
  <text x="1093" y="300" class="m">{ eventKey }</text>

  <!-- Row 2 -->
  <rect x="320" y="330" width="160" height="90" rx="10" class="box infra"/>
  <text x="400" y="360" text-anchor="middle" class="h">sql</text>
  <text x="400" y="380" text-anchor="middle" class="t">SQL Server</text>
  <text x="400" y="398" text-anchor="middle" class="t">submissions table</text>

  <rect x="510" y="330" width="160" height="90" rx="10" class="box infra"/>
  <text x="590" y="360" text-anchor="middle" class="h">smtp4dev</text>
  <text x="590" y="380" text-anchor="middle" class="t">owner notification</text>
  <text x="590" y="398" text-anchor="middle" class="t">inbox</text>

  <rect x="700" y="330" width="220" height="110" rx="10" class="box app"/>
  <text x="716" y="356" class="h">api  <tspan class="t" font-weight="400">SuperPower.Api</tspan></text>
  <text x="716" y="378" class="m">GET /events/{key}/bookings</text>
  <text x="716" y="398" class="m">BookingStoredConsumer</text>
  <text x="716" y="424" class="lbl">no external endpoint</text>

  <rect x="1000" y="330" width="170" height="90" rx="10" class="box msg"/>
  <text x="1085" y="360" text-anchor="middle" class="h">queue</text>
  <text x="1085" y="380" text-anchor="middle" class="t">RabbitMQ</text>
  <text x="1085" y="398" text-anchor="middle" class="m">booking-stored</text>

  <path d="M1000 375 H924" class="edge" marker-end="url(#arrow)"/>
  <text x="962" y="367" text-anchor="middle" class="lbl">consume</text>

  <!-- cache -->
  <rect x="700" y="510" width="220" height="80" rx="10" class="box msg"/>
  <text x="810" y="538" text-anchor="middle" class="h">cache</text>
  <text x="810" y="558" text-anchor="middle" class="t">Redis</text>
  <text x="810" y="576" text-anchor="middle" class="m">event:{guid}:bookings</text>
  <path d="M810 440 V506" class="edge" marker-end="url(#arrow)"/>
  <text x="818" y="470" class="lbl">+1 per booking</text>
  <text x="818" y="486" class="lbl">read count</text>

  <!-- Fail-soft note -->
  <rect x="320" y="470" width="350" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="338" y="496" font-size="14" font-weight="700" fill="#0f172a">Fail-soft</text>
  <text x="338" y="518" class="t">Without api, queue or cache the site still</text>
  <text x="338" y="536" class="t">works: the count read is capped at 2 s and a</text>
  <text x="338" y="554" class="t">failed publish never fails the submission.</text>
  <text x="338" y="572" class="t">Downstream problems show only in telemetry.</text>

  <!-- Legend -->
  <text x="40" y="460" font-size="13" font-weight="700" fill="#475569">Legend</text>
  <rect x="40" y="474" width="22" height="14" rx="3" class="box app"/>
  <text x="72" y="486" class="lbl">our code</text>
  <rect x="40" y="498" width="22" height="14" rx="3" class="box infra"/>
  <text x="72" y="510" class="lbl">backing service</text>
  <rect x="40" y="522" width="22" height="14" rx="3" class="box msg"/>
  <text x="72" y="534" class="lbl">messaging and cache</text>
  <rect x="40" y="546" width="22" height="14" rx="3" class="box ext"/>
  <text x="72" y="558" class="lbl">outside the AppHost</text>
  <text x="40" y="590" class="lbl">Telemetry flow: telemetry.svg</text>
</svg>
