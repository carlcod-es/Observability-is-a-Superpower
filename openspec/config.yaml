schema: spec-driven

# Shown to AI when creating artifacts. CLAUDE.md holds the full constraints and
# confirmed decisions; keep this in sync with it.
context: |
  Demo repo for the conference talk "Observability is a Superpower" (16 Oct 2026,
  45 min, live demo). Published for attendees afterwards.
  Fixed talk constraints: .NET 10, Umbraco 17 LTS, .NET Aspire, OpenTelemetry,
  Claude Code CLI with MCP: the repo registers Aspire MCP and Grafana MCP (read-only) (ADR-0022);
  on stage Grafana runs all talk and the agent uses only the Grafana MCP (ADR-0033).
  Prod hosting (PO 2026-10-15): the local environment behind a Cloudflare tunnel; Grafana plays
  production. Azure dropped.
  No custom package: the three forms are fixed in the site (PO 2026-10-10).
  Keep it simple: basic demo, no edge cases or features the demo does not show.
  Code must stay portable across Windows, macOS and Linux.
  Roles: the user is Product Owner. Proposals and designs are Architect work;
  every technology decision gets an ADR in docs/adrs/ (NNNN-<slug>.md, cited as ADR-NNNN).
  Cite numbered items with their source (e.g. ADR-0016, `<change>` task 5.3).

rules:
  proposal:
    - Product requirements only; no technology choices or implementation detail (projects,
      paths, packages, versions, tables); those belong in design.
    - Treat the fixed talk constraints as given, not as decisions to justify.
  specs:
    - Requirements state observable behaviour; reference ADRs for technology decisions.
    - Every requirement has at least one `#### Scenario:` with WHEN/THEN.
  design:
    - Each technology decision references its ADR in docs/adrs/; create or update the ADR
      in the same step (Title, Status, Context, Decision, Alternatives, Consequences).
    - For each decision state the alternatives considered and why they lost.
    - Fixed talk constraints are prerequisites; record them as context, and still check
      them for gaps (missing decisions they imply).
    - Name the bar (throwaway / prototype / production) and the test strategy that follows
      from it.
  tasks:
    - One section per component boundary with a single owner (see CLAUDE.md "Apply-phase
      team"); state each section's dependencies on other sections.
    - Each task ends with "verify ..." naming an automated check or a human observation.
